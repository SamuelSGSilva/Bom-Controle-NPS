<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- Adicionando uma fonte moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    
    <style>
        /* Estilos globais e Reset */
        :root {
            --bg-body: #0a0a0a;
            --bg-card: #141414;
            --border-color: #2a2a2a;
            --text-main: #ffffff;
            --text-muted: #888888;
            --color-promotor: #00cc66;
            --color-neutro: #f59e0b;
            --color-detrator: #cc0000;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            /* AJUSTADO: 100px no topo para o conteúdo não ficar escondido atrás da navbar */
            padding: 100px 24px 24px 24px; 
        }

        /* ADICIONADO: Configuração da Navbar Fixa */
        nav, .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
            background-color: var(--bg-card);
            padding: 0 24px;
            box-sizing: border-box;
            border-bottom: 2px solid var(--color-detrator); /* Linha vermelha da sua imagem */
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Tipografia */
        .section-title {
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        /* Grid de Cards Menores */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: #444;
        }

        .card h3 {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 500;
            margin: 0 0 8px 0;
        }

        .card p {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            color: var(--text-main);
        }

        /* Paineis Maiores (Gráficos e Tabela) */
        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-top: 24px;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        /* Tabela Moderna */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 400px;
            border-collapse: collapse;
        }

        th {
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: left;
            padding: 12px 16px;
            background-color: #1a1a1a;
            border-bottom: 1px solid var(--border-color);
        }

        th:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        th:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }

        td {
            padding: 14px 16px;
            font-size: 13px;
            color: #cccccc;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        tr:last-child td { border-bottom: none; }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        /* Botão de Excluir Modernizado */
        .btn-deletar {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-deletar:hover {
            border-color: var(--color-detrator);
            color: var(--color-detrator);
            background-color: rgba(204, 0, 0, 0.05);
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .grid-2col { grid-template-columns: 1fr; }
        }
    </style>

    <script src="toast.js"></script>
    <script src="navbar.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <main>
        <div style="margin-bottom: 32px;">
            <h2 id="boas-vindas" style="font-size: 22px; font-weight: 600; margin: 0 0 4px 0;">Olá! 👋</h2>
            <p style="color: #888888; font-size: 14px; margin: 0;">Aqui está o resumo do dia.</p>
        </div>

        <div class="cards">
            <div class="card">
                <h3>Índice NPS</h3>
                <p id="nps-score">--</p>
            </div>
            <div class="card">
                <h3>Clientes Satisfeitos</h3>
                <p id="promotores">--</p>
            </div>
            <div class="card">
                <h3>Clientes Indiferentes</h3>
                <p id="neutros">--</p>
            </div>
            <div class="card">
                <h3>Clientes Insatisfeitos</h3>
                <p id="detratores">--</p>
            </div>
            <div class="card">
                <h3>Total de Avaliações</h3>
                <p id="total">--</p>
            </div>
            <div class="card">
                <h3>Total de Clientes</h3>
                <p id="total-clientes">--</p>
            </div>
            <div class="card">
                <h3>Pós-vendas Pendentes</h3>
                <p id="posvendas-pendentes">--</p>
            </div>
        </div>

        <div class="panel">
            <h3 class="section-title">Evolução do NPS</h3>
            <div style="height: 220px;"><canvas id="grafico-evolucao"></canvas></div>
        </div>

        <div class="grid-2col">
            <!-- Adicionado Flexbox para o painel gerenciar a altura -->
            <div class="panel" style="display: flex; flex-direction: column;">
                <h3 class="section-title">Distribuição NPS</h3>
                <!-- Flex-grow faz a div empurrar e preencher todo o espaço vazio -->
                <div style="position: relative; flex-grow: 1; min-height: 220px;">
                    <canvas id="grafico-nps"></canvas>
                </div>
            </div>

            <div class="panel table-container">
                <h3 class="section-title">Últimas Avaliações</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Nota</th>
                            <th>Data</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-ultimas-avaliacoes"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'index.html';

        function dataLocal(isoSemFuso) {
            return new Date(isoSemFuso.endsWith('Z') ? isoSemFuso : isoSemFuso + 'Z');
        }

        async function carregarNPS() {
            try {
                const response = await fetch('/avaliacoes/relatorio/nps', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (data.message) {
                    document.getElementById('nps-score').textContent = '--';
                    document.getElementById('promotores').textContent = '--';
                    document.getElementById('neutros').textContent = '--';
                    document.getElementById('detratores').textContent = '--';
                    document.getElementById('total').textContent = '0';
                    return;
                }

                document.getElementById('nps-score').textContent = data.nps + '%';
                document.getElementById('promotores').textContent = data.promotores;
                document.getElementById('neutros').textContent = data.neutros;
                document.getElementById('detratores').textContent = data.detratores;
                document.getElementById('total').textContent = data.total_avaliacoes;

                renderizarGrafico(data.promotores, data.neutros, data.detratores);
            } catch (error) {
                console.error("Erro ao carregar NPS", error);
            }
        }

        async function carregarResumo() {
            try {
                const resClientes = await fetch('/clientes', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const username = localStorage.getItem('username');
                document.getElementById('boas-vindas').textContent = `Olá, ${username || 'Usuário'}! 👋`;

                const clientes = await resClientes.json();
                document.getElementById('total-clientes').textContent = clientes.length;

                const resPosVendas = await fetch('/pos-venda', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const posvendas = await resPosVendas.json();
                const pendentes = posvendas.filter(pv => pv.status === 'pendente').length;
                document.getElementById('posvendas-pendentes').textContent = pendentes;
            } catch (error) {
                console.error("Erro ao carregar resumo", error);
            }
        }

        async function carregarUltimasAvaliacoes() {
            try {
                const [resNPS, resCli] = await Promise.all([
                    fetch('/avaliacoes', { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch('/clientes', { headers: { 'Authorization': `Bearer ${token}` } })
                ]);

                const avaliacoes = await resNPS.json();
                const clientes = await resCli.json();
                const tabela = document.getElementById('tabela-ultimas-avaliacoes');
                tabela.innerHTML = '';

                if (!avaliacoes.length) {
                    tabela.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:30px;">Nenhuma avaliação recente</td></tr>';
                    return;
                }

                const ultimas = avaliacoes.slice(-5).reverse();
                ultimas.forEach(a => {
                    const cliente = clientes.find(c => c.id === a.cliente_id);
                    const nome = cliente ? cliente.nome : `ID ${a.cliente_id}`;
                    const cores = { promotor: 'var(--color-promotor)', neutro: 'var(--color-neutro)', detrator: 'var(--color-detrator)', semnota: 'var(--text-muted)' };
                    const temNota = a.nps_score !== null && a.nps_score !== undefined;
                    const tipo = !temNota ? 'semnota' : a.nps_score === 5 ? 'promotor' : a.nps_score === 4 ? 'neutro' : 'detrator';
                    const nota = temNota ? `${a.nps_score}/5` : '--';
                    
                    tabela.innerHTML += `
                    <tr>
                        <td style="font-weight: 500;">${nome}</td>
                        <td>
                            <span style="background: ${cores[tipo]}20; color: ${cores[tipo]}; padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 12px;">
                                ${nota}
                            </span>
                        </td>
                        <td style="color: var(--text-muted);">${dataLocal(a.created_at).toLocaleDateString('pt-BR')}</td>
                        <td>
                            <button class="btn-deletar" onclick="excluirAvaliacao(${a.id})">Excluir</button>
                        </td>
                    </tr>`;
                });
            } catch (error) {
                console.error("Erro ao carregar últimas avaliações", error);
            }
        }

        async function excluirAvaliacao(id) {
            if (!confirm('Tem certeza que deseja excluir esta avaliação?')) return;

            const response = await fetch(`/avaliacoes/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.ok) {
                if (typeof toast === 'function') toast('Avaliação excluída com sucesso!');
                await carregarNPS();
                await carregarUltimasAvaliacoes();
            } else {
                if (typeof toast === 'function') toast('Erro ao excluir avaliação!', 'erro');
            }
        }

        // Configurações globais do Chart.js para o tema escuro
        if (window.Chart) { 
            Chart.defaults.font.family = "'Inter', sans-serif";
            Chart.defaults.font.size = 12; 
            Chart.defaults.color = '#888888'; 
        }

        let chartNPS = null;
        function renderizarGrafico(promotores, neutros, detratores) {
            const ctx = document.getElementById('grafico-nps').getContext('2d');
            
            // Destroi o gráfico anterior para evitar sobreposição se a função for chamada novamente
            if(chartNPS) chartNPS.destroy(); 

            chartNPS = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Satisfeitos', 'Indiferentes', 'Insatisfeitos'],
                    datasets: [{
                        data: [promotores, neutros, detratores],
                        backgroundColor: ['#00cc66', '#f59e0b', '#cc0000'], // Cores originais do seu código
                        borderRadius: 6,
                        borderSkipped: false,
                        
                        // --- AQUI ESTÁ A CORREÇÃO DAS BARRAS GIGANTES ---
                        maxBarThickness: 35,    // Trava a largura máxima da barra em pixels
                        barPercentage: 0.5,     // Afina a barra dentro do espaço da categoria
                        categoryPercentage: 0.8 // Ajusta o respiro entre as colunas
                        // ------------------------------------------------
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false } 
                    },
                    scales: {
                        x: { 
                            grid: { display: false } // Remove as linhas verticais de fundo
                        }, 
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.05)' }, // Linhas horizontais bem sutis
                            beginAtZero: true,
                            ticks: { stepSize: 1 } // Garante que o eixo Y ande de 1 em 1 (sem números quebrados)
                        }
                    }
                }
            });
        }

        let chartEvolucao = null;
        async function carregarEvolucaoNPS() {
            try {
                const response = await fetch('/avaliacoes/relatorio/evolucao', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (data.message || !data.evolucao || !data.evolucao.length) return;

                const meses = { '01': 'Jan', '02': 'Fev', '03': 'Mar', '04': 'Abr', '05': 'Mai', '06': 'Jun', '07': 'Jul', '08': 'Ago', '09': 'Set', '10': 'Out', '11': 'Nov', '12': 'Dez' };
                const labels = data.evolucao.map(item => {
                    const [ano, mes] = item.mes.split('-');
                    return `${meses[mes]}/${ano.slice(2)}`;
                });
                const valores = data.evolucao.map(item => item.nps);

                const ctx = document.getElementById('grafico-evolucao').getContext('2d');
                
                if(chartEvolucao) chartEvolucao.destroy();

                chartEvolucao = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                            label: 'NPS',
                            data: valores,
                            borderColor: '#cc0000',
                            backgroundColor: 'rgba(204, 0, 0, 0.1)', // Fundo mais suave
                            fill: true,
                            tension: 0.4, // Curva mais suave
                            pointBackgroundColor: '#141414', // Ponto combinando com o fundo
                            pointBorderColor: '#cc0000',
                            pointBorderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { display: false } },
                            y: {
                                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                suggestedMin: -100,
                                suggestedMax: 100
                            }
                        }
                    }
                });
            } catch (error) {
                console.error("Erro ao carregar evolução do NPS", error);
            }
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        }

        carregarNPS();
        carregarResumo();
        carregarUltimasAvaliacoes();
        carregarEvolucaoNPS();
    </script>
</body>

</html>
