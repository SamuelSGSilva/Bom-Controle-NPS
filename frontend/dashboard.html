<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    
    <!-- Chamando o seu global.css que já tem todas as cores, fontes e estilos -->
    <link rel="stylesheet" href="global.css">
    
    <script src="toast.js"></script>
    <script src="navbar.js?v=2" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <!-- A navbar será injetada aqui pelo navbar.js -->

    <main>
        <!-- Cabeçalho da página -->
        <div style="margin-bottom: 24px;">
            <h2 id="boas-vindas">Olá! 👋</h2>
            <p class="subtitulo">Aqui está o resumo do dia.</p>
        </div>

        <!-- Cards (Usa a classe .cards e .card do seu global.css) -->
        <div class="cards">
            <div class="card">
                <h3>Índice NPS</h3>
                <p id="nps-score">--</p>
            </div>
            <div class="card">
                <h3>Clientes Satisfeitos</h3>
                <p id="promotores">--</p>
            </div>
            <div class="card">
                <h3>Clientes Indiferentes</h3>
                <p id="neutros">--</p>
            </div>
            <div class="card">
                <h3>Clientes Insatisfeitos</h3>
                <p id="detratores">--</p>
            </div>
            <div class="card">
                <h3>Total de Avaliações</h3>
                <p id="total">--</p>
            </div>
            <div class="card">
                <h3>Total de Clientes</h3>
                <p id="total-clientes">--</p>
            </div>
            <div class="card">
                <h3>Pós-vendas Pendentes</h3>
                <p id="posvendas-pendentes">--</p>
            </div>
        </div>

        <!-- Gráfico de Evolução (Usa a classe .secao do global.css) -->
        <div class="secao">
            <h3>Evolução do NPS</h3>
            <!-- É crucial ter position: relative e uma altura aqui para o Chart.js não bugar -->
            <div style="position: relative; height: 300px; width: 100%;">
                <canvas id="grafico-evolucao"></canvas>
            </div>
        </div>

        <!-- Grid para colocar o Gráfico de Distribuição e a Tabela lado a lado -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 24px;">
            
            <!-- Painel Esquerdo: Gráfico -->
            <div class="secao" style="display: flex; flex-direction: column; margin-bottom: 0;">
                <h3>Distribuição NPS</h3>
                <div style="position: relative; flex-grow: 1; min-height: 250px; width: 100%;">
                    <canvas id="grafico-nps"></canvas>
                </div>
            </div>

            <!-- Painel Direito: Tabela -->
            <div class="secao table-container" style="margin-bottom: 0;">
                <h3>Últimas Avaliações</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Nota</th>
                            <th>Data</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-ultimas-avaliacoes"></tbody>
                </table>
            </div>

        </div>
    </main>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'index.html';

        function dataLocal(isoSemFuso) {
            return new Date(isoSemFuso.endsWith('Z') ? isoSemFuso : isoSemFuso + 'Z');
        }

        async function carregarNPS() {
            try {
                const response = await fetch('/avaliacoes/relatorio/nps', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (data.message) {
                    document.getElementById('nps-score').textContent = '--';
                    document.getElementById('promotores').textContent = '--';
                    document.getElementById('neutros').textContent = '--';
                    document.getElementById('detratores').textContent = '--';
                    document.getElementById('total').textContent = '0';
                    return;
                }

                document.getElementById('nps-score').textContent = data.nps + '%';
                document.getElementById('promotores').textContent = data.promotores;
                document.getElementById('neutros').textContent = data.neutros;
                document.getElementById('detratores').textContent = data.detratores;
                document.getElementById('total').textContent = data.total_avaliacoes;

                renderizarGrafico(data.promotores, data.neutros, data.detratores);
            } catch (error) {
                console.error("Erro ao carregar NPS", error);
            }
        }

        async function carregarResumo() {
            try {
                const resClientes = await fetch('/clientes', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const username = localStorage.getItem('username');
                document.getElementById('boas-vindas').textContent = `Olá, ${username || 'Usuário'}! 👋`;

                const clientes = await resClientes.json();
                document.getElementById('total-clientes').textContent = clientes.length;

                const resPosVendas = await fetch('/pos-venda', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const posvendas = await resPosVendas.json();
                const pendentes = posvendas.filter(pv => pv.status === 'pendente').length;
                document.getElementById('posvendas-pendentes').textContent = pendentes;
            } catch (error) {
                console.error("Erro ao carregar resumo", error);
            }
        }

        async function carregarUltimasAvaliacoes() {
            try {
                const [resNPS, resCli] = await Promise.all([
                    fetch('/avaliacoes', { headers: { 'Authorization': `Bearer ${token}` } }),
                    fetch('/clientes', { headers: { 'Authorization': `Bearer ${token}` } })
                ]);

                const avaliacoes = await resNPS.json();
                const clientes = await resCli.json();
                const tabela = document.getElementById('tabela-ultimas-avaliacoes');
                tabela.innerHTML = '';

                if (!avaliacoes.length) {
                    tabela.innerHTML = '<tr><td colspan="4" class="vazio">Nenhuma avaliação recente</td></tr>';
                    return;
                }

                const ultimas = avaliacoes.slice(-5).reverse();
                ultimas.forEach(a => {
                    const cliente = clientes.find(c => c.id === a.cliente_id);
                    const nome = cliente ? cliente.nome : `ID ${a.cliente_id}`;
                    
                    // Ajuste visual para a nota
                    const temNota = a.nps_score !== null && a.nps_score !== undefined;
                    let corNota = '#888';
                    if (temNota) {
                        if (a.nps_score === 5) corNota = '#00cc66';
                        else if (a.nps_score === 4) corNota = '#f59e0b';
                        else corNota = '#cc0000';
                    }
                    const nota = temNota ? `${a.nps_score}/5` : '--';
                    
                    tabela.innerHTML += `
                    <tr>
                        <td style="font-weight: 500; color: #fff;">${nome}</td>
                        <td>
                            <span style="color: ${corNota}; font-weight: 600; font-size: 14px;">
                                ${nota}
                            </span>
                        </td>
                        <td style="color: var(--muted);">${dataLocal(a.created_at).toLocaleDateString('pt-BR')}</td>
                        <td>
                            <!-- Usando o estilo de botão do seu global.css -->
                            <button class="btn-deletar" onclick="excluirAvaliacao(${a.id})">Excluir</button>
                        </td>
                    </tr>`;
                });
            } catch (error) {
                console.error("Erro ao carregar últimas avaliações", error);
            }
        }

        async function excluirAvaliacao(id) {
            if (!confirm('Tem certeza que deseja excluir esta avaliação?')) return;

            const response = await fetch(`/avaliacoes/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.ok) {
                if (typeof toast === 'function') toast('Avaliação excluída com sucesso!');
                await carregarNPS();
                await carregarUltimasAvaliacoes();
            } else {
                if (typeof toast === 'function') toast('Erro ao excluir avaliação!', 'erro');
            }
        }

        // Configurações globais do Chart.js
        if (window.Chart) { 
            Chart.defaults.font.family = "'Inter', sans-serif";
            Chart.defaults.font.size = 12; 
            Chart.defaults.color = '#8b8b93'; 
        }

        let chartNPS = null;
        function renderizarGrafico(promotores, neutros, detratores) {
            const ctx = document.getElementById('grafico-nps').getContext('2d');
            
            if(chartNPS) chartNPS.destroy(); 

            chartNPS = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Satisfeitos', 'Indiferentes', 'Insatisfeitos'],
                    datasets: [{
                        data: [promotores, neutros, detratores],
                        backgroundColor: ['#00cc66', '#f59e0b', '#e01b1b'],
                        borderRadius: 6,
                        borderSkipped: false,
                        maxBarThickness: 45, // Evita que barras fiquem gigantes
                        barPercentage: 0.5,
                        categoryPercentage: 0.8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false, // Fundamental para o gráfico esticar e preencher a div
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false } },
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.03)' },
                            beginAtZero: true,
                            ticks: { stepSize: 1 }
                        }
                    }
                }
            });
        }

        let chartEvolucao = null;
        async function carregarEvolucaoNPS() {
            try {
                const response = await fetch('/avaliacoes/relatorio/evolucao', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                if (data.message || !data.evolucao || !data.evolucao.length) return;

                const meses = { '01': 'Jan', '02': 'Fev', '03': 'Mar', '04': 'Abr', '05': 'Mai', '06': 'Jun', '07': 'Jul', '08': 'Ago', '09': 'Set', '10': 'Out', '11': 'Nov', '12': 'Dez' };
                const labels = data.evolucao.map(item => {
                    const [ano, mes] = item.mes.split('-');
                    return `${meses[mes]}/${ano.slice(2)}`;
                });
                const valores = data.evolucao.map(item => item.nps);

                const ctx = document.getElementById('grafico-evolucao').getContext('2d');
                
                if(chartEvolucao) chartEvolucao.destroy();

                chartEvolucao = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                            label: 'NPS',
                            data: valores,
                            borderColor: '#e01b1b', // Vermelho padrão do seu CSS
                            backgroundColor: 'rgba(224, 27, 27, 0.1)',
                            fill: true,
                            tension: 0.4,
                            pointBackgroundColor: '#16161a',
                            pointBorderColor: '#e01b1b',
                            pointBorderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { display: false } },
                            y: {
                                grid: { color: 'rgba(255, 255, 255, 0.03)' },
                                suggestedMin: -100,
                                suggestedMax: 100
                            }
                        }
                    }
                });
            } catch (error) {
                console.error("Erro ao carregar evolução do NPS", error);
            }
        }

        carregarNPS();
        carregarResumo();
        carregarUltimasAvaliacoes();
        carregarEvolucaoNPS();
    </script>
</body>

</html>
