<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    
    <!-- Chamando APENAS o seu global.css -->
    <link rel="stylesheet" href="global.css">
    
    <script src="toast.js"></script>
    <!-- Adicionando o ?v=2 para fugir do cache -->
    <script src="navbar.js?v=2" defer></script>
</head>

<body>
    <!-- A navbar é injetada aqui pelo navbar.js -->

    <main>
        <h2 style="margin-bottom: 24px;">Clientes</h2>
        
        <!-- A classe .busca do seu global.css alinha o input e o botão lado a lado -->
        <div class="busca">
            <input type="text" id="busca" placeholder="Buscar por nome..." onkeyup="filtrarClientes()">
            <button class="btn-novo" onclick="novoCliente()">+ Novo Cliente</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>CPF/CNPJ</th>
                        <th>Cidade/Estado</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-clientes">
                </tbody>
            </table>
        </div>
        
        <!-- Container para a paginação -->
        <div id="paginacao" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:24px; justify-content:center;"></div>
    </main>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'index.html';

        let todosClientes = [];
        let paginaAtual = 1;
        const itensPorPagina = 10;

        async function carregarClientes() {
            try {
                const response = await fetch('/clientes', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                todosClientes = await response.json();
                renderizarClientes(todosClientes);
            } catch (error) {
                console.error("Erro ao carregar clientes", error);
            }
        }

        function renderizarClientes(clientes) {
            const tabela = document.getElementById('tabela-clientes');
            const total = clientes.length;
            const totalPaginas = Math.ceil(total / itensPorPagina);
            const inicio = (paginaAtual - 1) * itensPorPagina;
            const fim = inicio + itensPorPagina;
            const clientesPagina = clientes.slice(inicio, fim);

            tabela.innerHTML = '';

            if (clientes.length === 0) {
                tabela.innerHTML = '<tr><td colspan="6" class="vazio">Nenhum cliente encontrado</td></tr>';
                renderizarPaginacao([], 0);
                return;
            }

            clientesPagina.forEach(cliente => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td data-label="Nome" style="color: #fff; font-weight: 500;">${cliente.nome}</td>
                    <td data-label="E-mail">${cliente.email}</td>
                    <td data-label="Telefone">${cliente.telefone || '--'}</td>
                    <td data-label="CPF/CNPJ">${cliente.cpf || cliente.cnpj || '--'}</td>
                    <td data-label="Cidade/Estado">${cliente.cidade || '--'}/${cliente.estado || '--'}</td>
                    <td data-label="Ações">
                        <!-- Usando as classes exatas de botão do global.css -->
                        <button class="btn-ver" onclick="verHistorico(${cliente.id})">Ver</button>
                        <button class="btn-editar" onclick="editarCliente(${cliente.id})">Editar</button>
                        <button class="btn-deletar" onclick="deletarCliente(${cliente.id})">Excluir</button>
                    </td>
                `;
                tabela.appendChild(row);
            });

            renderizarPaginacao(clientes, totalPaginas);
        }

        function renderizarPaginacao(clientes, totalPaginas) {
            const paginacao = document.getElementById('paginacao');
            paginacao.innerHTML = '';
            
            if (totalPaginas <= 1) return;

            for (let i = 1; i <= totalPaginas; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                
                // Estilo simples de paginação alinhado com o tema escuro
                btn.style.cssText = `
                    padding: 6px 12px;
                    border-radius: 6px;
                    border: 1px solid ${i === paginaAtual ? 'var(--red)' : 'var(--line)'};
                    background: ${i === paginaAtual ? 'var(--red)' : 'transparent'};
                    color: #fff;
                    cursor: pointer;
                    font-size: 13px;
                    font-weight: 600;
                    transition: all 0.2s;
                `;
                
                btn.onclick = () => {
                    paginaAtual = i;
                    renderizarClientes(todosClientes);
                };
                paginacao.appendChild(btn);
            }
        }

        function filtrarClientes() {
            paginaAtual = 1;
            const busca = document.getElementById('busca').value.toLowerCase();
            const filtrados = todosClientes.filter(c => c.nome.toLowerCase().includes(busca));
            renderizarClientes(filtrados);
        }

        function editarCliente(id) {
            window.location.href = `editar-cliente.html?id=${id}`;
        }

        async function deletarCliente(id) {
            if (!confirm('Tem certeza que deseja excluir este cliente?')) return;

            const response = await fetch(`/clientes/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (response.ok) {
                if (typeof toast === 'function') toast('Cliente excluído com sucesso!');
                carregarClientes();
            } else {
                if (typeof toast === 'function') toast('Erro ao excluir cliente!', 'erro');
            }
        }

        function verHistorico(id) {
            window.location.href = `historico.html?id=${id}`;
        }

        function novoCliente() {
            window.location.href = 'novo-cliente.html';
        }

        carregarClientes();
    </script>
</body>

</html>
