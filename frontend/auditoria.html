<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="responsive.css">
    <script src="toast.js"></script>
    <script src="navbar.js" defer></script>
</head>

<body>


    <main>
        <h2>Log de auditoria</h2>
        <p class="subtitulo">Histórico de tudo que foi criado, alterado ou excluído no sistema</p>

        <div class="filtros">
            <select id="filtro-entidade" onchange="aplicarFiltros()">
                <option value="">Todas as telas</option>
                <option value="cliente">Clientes</option>
                <option value="pos_venda">Pós-venda</option>
                <option value="avaliacao">Avaliações</option>
            </select>
            <select id="filtro-acao" onchange="aplicarFiltros()">
                <option value="">Todas as ações</option>
                <option value="create">Criado</option>
                <option value="update">Atualizado</option>
                <option value="delete">Excluído</option>
            </select>
            <input type="text" id="busca-usuario" placeholder="Buscar por usuário..." oninput="aplicarFiltros()">
        </div>

        <div id="loading" style="text-align: center; padding: 40px; display: none;">
            <div class="spinner"></div>
            <p style="color: #888888; margin-top: 12px;">Carregando...</p>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Quando</th>
                        <th>Tela</th>
                        <th>Ação</th>
                        <th>Registro</th>
                        <th>Usuário</th>
                        <th>Detalhes</th>
                    </tr>
                </thead>
                <tbody id="tabela-logs"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal de Detalhes -->
    <div class="modal-fundo" id="modal-auditoria">
        <div class="modal-caixa">
            <button class="modal-fechar" onclick="fecharModalAuditoria()">&times;</button>
            
            <h3 id="modal-titulo" style="font-size: 18px; margin-bottom: 4px; display: flex; align-items: center; gap: 10px;">
                Detalhes
            </h3>
            <p class="subtitulo" id="modal-subtitulo" style="font-size: 13px;"></p>

            <div class="table-container" style="margin-top: 20px;">
                <table>
                    <thead>
                        <tr>
                            <th>Campo</th>
                            <th>Antes</th>
                            <th>Depois</th>
                        </tr>
                    </thead>
                    <tbody id="modal-tabela-corpo">
                        <!-- O conteúdo das alterações será injetado aqui -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'index.html';

        function dataLocal(isoSemFuso) {
            return new Date(isoSemFuso.endsWith('Z') ? isoSemFuso : isoSemFuso + 'Z');
        }

        let todosLogs = [];

        // Função ajustada para procurar o ID "tabela-logs"
    async function carregarLogs() {
    document.getElementById('loading').style.display = 'block';
    
    const tabela = document.getElementById('tabela-logs');
    if (tabela) tabela.innerHTML = '';

    try {
        const response = await fetch('/logs-auditoria', {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        document.getElementById('loading').style.display = 'none';

        if (!response.ok) {
            if (response.status === 401) {
                localStorage.removeItem('token');
                window.location.href = 'index.html';
                return;
            }
            if (typeof toast === 'function') toast('Erro ao carregar log de auditoria!', 'erro');
            return;
        }

        todosLogs = await response.json();
        
        // NOSSO ESPIÃO: Vai mostrar no Console (F12) como os dados estão vindo
        console.log("Dados que chegaram do backend:", todosLogs[0]);
        
        renderizarLogs(todosLogs);
    } catch (error) {
        document.getElementById('loading').style.display = 'none';
        console.error("Erro ao carregar auditoria", error);
    }
}
        function renderizarLogs(logs) {
    const tabela = document.getElementById('tabela-logs');
    
    if (!tabela) {
        console.error("Tabela não encontrada no HTML!");
        return;
    }
    
    tabela.innerHTML = '';

    if (logs.length === 0) {
        tabela.innerHTML = '<tr><td colspan="6" class="vazio">Nenhum registro encontrado</td></tr>';
        return;
    }

    logs.forEach(log => {
        const row = document.createElement('tr');

        // Arrumando a Ação (create/update para Português)
        let acaoTexto = log.acao || log.action || '--';
        let badgeClass = 'badge';
        
        if (acaoTexto === 'create' || acaoTexto === 'Criado') {
            acaoTexto = 'Criado';
            badgeClass = 'badge badge-create';
        } else if (acaoTexto === 'update' || acaoTexto === 'Atualizado') {
            acaoTexto = 'Atualizado';
            badgeClass = 'badge badge-update';
        } else if (acaoTexto === 'delete' || acaoTexto === 'Excluído') {
            acaoTexto = 'Excluído';
            badgeClass = 'badge badge-delete';
        }

        // Arrumando a Tela
        const nomeTela = log.entidade || log.tela || log.tabela || 'Desconhecida';

        // EXTRAINDO O REGISTRO DE DENTRO DO JSON (dados_depois ou dados_antes)
        let nomeRegistro = '--';
        const jsonTexto = log.dados_depois || log.dados_antes;
        
        if (jsonTexto) {
            try {
                // Transforma o texto em objeto JavaScript de verdade
                const objDados = JSON.parse(jsonTexto);
                
                // Procura pelas chaves mais comuns de identificação dentro do objeto
                nomeRegistro = objDados.cliente_nome || 
                               objDados.nome || 
                               (objDados.numero_os ? `OS: ${objDados.numero_os}` : null) || 
                               (objDados.id ? `ID: ${objDados.id}` : '--');
            } catch (e) {
                // Se der erro ao ler o JSON, deixa o padrão
                nomeRegistro = '--';
            }
        }
        
        const nomeUsuario = log.usuario || log.usuario_nome || '--';

        row.innerHTML = `
            <td data-label="Quando">${dataLocal(log.created_at).toLocaleString('pt-BR')}</td>
            <td data-label="Tela" style="font-weight: 500; color: #fff;">${nomeTela}</td>
            <td data-label="Ação"><span class="${badgeClass}">${acaoTexto}</span></td>
            <td data-label="Registro">${nomeRegistro}</td>
            <td data-label="Usuário">${nomeUsuario}</td>
            <td data-label="Detalhes">
                <button class="btn-ver" onclick='abrirModalAuditoria(${JSON.stringify(log).replace(/'/g, "&apos;")})'>Ver</button>
            </td>
        `;
        tabela.appendChild(row);
    });
}

        function aplicarFiltros() {
    // 1. Buscamos os elementos no HTML
    const elTela = document.getElementById('filtro-tela');
    const elAcao = document.getElementById('filtro-acao');
    const elUsuario = document.getElementById('busca-usuario');

    // 2. Se o elemento existir, pegamos o valor. Se não, usamos texto vazio ('').
    const tela = elTela ? elTela.value : '';
    const acao = elAcao ? elAcao.value : '';
    const buscaUser = elUsuario ? elUsuario.value.trim().toLowerCase() : '';

    let filtrados = todosLogs;

    // 3. Aplicamos os filtros
    if (tela) {
        filtrados = filtrados.filter(l => l.tela === tela);
    }
    if (acao) {
        filtrados = filtrados.filter(l => l.acao === acao);
    }
    if (buscaUser) {
        filtrados = filtrados.filter(l => (l.usuario_nome || '').toLowerCase().includes(buscaUser));
    }

    // 4. Desenhamos a tabela novamente
    renderizarLogs(filtrados);
}

        function abrirModalAuditoria(log) {
    let badgeClass = 'badge';
    if (log.acao === 'Criado') badgeClass = 'badge badge-create';
    else if (log.acao === 'Atualizado') badgeClass = 'badge badge-update';
    else if (log.acao === 'Excluído') badgeClass = 'badge badge-delete';

    const titulo = document.getElementById('modal-titulo');
    const subtitulo = document.getElementById('modal-subtitulo');
    const corpoTabela = document.getElementById('modal-tabela-corpo');
    const modal = document.getElementById('modal-auditoria');

    if (!titulo || !subtitulo || !corpoTabela || !modal) return;

    // CORREÇÃO: Mesma proteção de nomes aplicada aqui no modal
    const nomeRegistro = log.registro || log.registro_nome || log.entidade_nome || log.cliente_nome || 'Registro';
    const nomeUsuario = log.usuario || log.usuario_nome || log.nome_usuario || 'Sistema';

    titulo.innerHTML = `${log.tela} <span class="${badgeClass}" style="font-size: 11px;">${log.acao}</span>`;
    subtitulo.textContent = `${nomeRegistro} · por ${nomeUsuario} em ${dataLocal(log.created_at).toLocaleString('pt-BR')}`;

    corpoTabela.innerHTML = '';

    if (log.detalhes && Array.isArray(log.detalhes)) {
        log.detalhes.forEach(detalhe => {
            corpoTabela.innerHTML += `
                <tr>
                    <td style="font-weight: 500; color: #fff;">${detalhe.campo}</td>
                    <td style="color: #ccc;">${detalhe.antes || '--'}</td>
                    <td style="color: #ccc;">${detalhe.depois || '--'}</td>
                </tr>
            `;
        });
    } else {
        corpoTabela.innerHTML = `<tr><td colspan="3" class="vazio">Nenhum detalhe adicional disponível para esta ação.</td></tr>`;
    }

    modal.classList.add('ativo');
}

        function fecharModalAuditoria() {
            document.getElementById('modal-auditoria').classList.remove('ativo');
        }

        carregarLogs();
    </script>
</body>

</html>
