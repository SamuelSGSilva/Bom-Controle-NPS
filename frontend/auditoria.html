<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log de Auditoria</title>
    
    <!-- Chamando APENAS o global.css -->
    <link rel="stylesheet" href="global.css">
    
    <script src="toast.js"></script>
    <script src="navbar.js?v=5" defer></script>
</head>

<body>
    <!-- A navbar é injetada aqui pelo navbar.js -->

    <main>
        <h2 style="margin-bottom: 4px;">Log de auditoria</h2>
        <p class="subtitulo">Histórico de tudo que foi criado, alterado ou excluído no sistema</p>

        <!-- A classe .busca coloca todos os filtros lado a lado -->
        <div class="busca">
            <select id="filtro-tela" onchange="aplicarFiltros()">
                <option value="">Todas as telas</option>
                <option value="Cliente">Cliente</option>
                <option value="Pós-venda">Pós-venda</option>
                <option value="Avaliação">Avaliação</option>
            </select>
            
            <select id="filtro-acao" onchange="aplicarFiltros()">
                <option value="">Todas as ações</option>
                <option value="Criado">Criado</option>
                <option value="Atualizado">Atualizado</option>
                <option value="Excluído">Excluído</option>
            </select>
            
            <input type="text" id="busca-usuario" placeholder="Buscar por usuário..." onkeyup="aplicarFiltros()">
        </div>

        <div id="loading" style="text-align: center; padding: 40px; display: none;">
            <div class="spinner"></div>
            <p style="color: #888888; margin-top: 12px;">Carregando logs...</p>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Quando</th>
                        <th>Tela</th>
                        <th>Ação</th>
                        <th>Registro</th>
                        <th>Usuário</th>
                        <th>Detalhes</th>
                    </tr>
                </thead>
                <tbody id="tabela-auditoria"></tbody>
            </table>
        </div>
    </main>

    <!-- Modal de Detalhes -->
    <div class="modal-fundo" id="modal-auditoria">
        <div class="modal-caixa">
            <!-- A classe modal-fechar e o &times; consertam o botão estranho da imagem 2 -->
            <button class="modal-fechar" onclick="fecharModalAuditoria()">&times;</button>
            
            <h3 id="modal-titulo" style="font-size: 18px; margin-bottom: 4px; display: flex; align-items: center; gap: 10px;">
                <!-- O título e a badge serão injetados aqui -->
            </h3>
            <p class="subtitulo" id="modal-subtitulo" style="font-size: 13px;"></p>

            <div class="table-container" style="margin-top: 20px;">
                <table>
                    <thead>
                        <tr>
                            <th>Campo</th>
                            <th>Antes</th>
                            <th>Depois</th>
                        </tr>
                    </thead>
                    <tbody id="modal-tabela-corpo">
                        <!-- O conteúdo das alterações será injetado aqui -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = 'index.html';

        function dataLocal(isoSemFuso) {
            return new Date(isoSemFuso.endsWith('Z') ? isoSemFuso : isoSemFuso + 'Z');
        }

        let todosLogs = [];

        async function carregarAuditoria() {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('tabela-auditoria').innerHTML = '';

            try {
                // Ajuste a URL abaixo para o endpoint correto da sua API
                const response = await fetch('/auditoria', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                document.getElementById('loading').style.display = 'none';

                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('token');
                        window.location.href = 'index.html';
                        return;
                    }
                    if (typeof toast === 'function') toast('Erro ao carregar auditoria!', 'erro');
                    return;
                }

                todosLogs = await response.json();
                renderizarLogs(todosLogs);
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                console.error("Erro ao carregar auditoria", error);
            }
        }

        function renderizarLogs(logs) {
            const tabela = document.getElementById('tabela-auditoria');
            tabela.innerHTML = '';

            if (logs.length === 0) {
                tabela.innerHTML = '<tr><td colspan="6" class="vazio">Nenhum registro encontrado</td></tr>';
                return;
            }

            logs.forEach(log => {
                const row = document.createElement('tr');

                // Escolhendo a classe de cor da badge baseada na ação
                let badgeClass = 'badge';
                if (log.acao === 'Criado') badgeClass = 'badge badge-create';
                else if (log.acao === 'Atualizado') badgeClass = 'badge badge-update';
                else if (log.acao === 'Excluído') badgeClass = 'badge badge-delete';

                row.innerHTML = `
                    <td data-label="Quando">${dataLocal(log.created_at).toLocaleString('pt-BR')}</td>
                    <td data-label="Tela" style="font-weight: 500; color: #fff;">${log.tela}</td>
                    <td data-label="Ação"><span class="${badgeClass}">${log.acao}</span></td>
                    <td data-label="Registro">${log.registro_nome || '--'}</td>
                    <td data-label="Usuário">${log.usuario_nome || '--'}</td>
                    <td data-label="Detalhes">
                        <button class="btn-ver" onclick='abrirModalAuditoria(${JSON.stringify(log).replace(/'/g, "&apos;")})'>Ver</button>
                    </td>
                `;
                tabela.appendChild(row);
            });
        }

        function aplicarFiltros() {
            const tela = document.getElementById('filtro-tela').value;
            const acao = document.getElementById('filtro-acao').value;
            const buscaUser = document.getElementById('busca-usuario').value.trim().toLowerCase();

            let filtrados = todosLogs;

            if (tela) {
                filtrados = filtrados.filter(l => l.tela === tela);
            }
            if (acao) {
                filtrados = filtrados.filter(l => l.acao === acao);
            }
            if (buscaUser) {
                filtrados = filtrados.filter(l => (l.usuario_nome || '').toLowerCase().includes(buscaUser));
            }

            renderizarLogs(filtrados);
        }

        function abrirModalAuditoria(log) {
            // Estilizando a badge do título
            let badgeClass = 'badge';
            if (log.acao === 'Criado') badgeClass = 'badge badge-create';
            else if (log.acao === 'Atualizado') badgeClass = 'badge badge-update';
            else if (log.acao === 'Excluído') badgeClass = 'badge badge-delete';

            document.getElementById('modal-titulo').innerHTML = `${log.tela} <span class="${badgeClass}" style="font-size: 11px;">${log.acao}</span>`;
            document.getElementById('modal-subtitulo').textContent = `${log.registro_nome || 'Registro'} · por ${log.usuario_nome || 'Sistema'} em ${dataLocal(log.created_at).toLocaleString('pt-BR')}`;

            const corpoTabela = document.getElementById('modal-tabela-corpo');
            corpoTabela.innerHTML = '';

            // Se o log tiver campos detalhados (ex: JSON de antes e depois)
            if (log.detalhes && Array.isArray(log.detalhes)) {
                log.detalhes.forEach(detalhe => {
                    corpoTabela.innerHTML += `
                        <tr>
                            <td style="font-weight: 500; color: #fff;">${detalhe.campo}</td>
                            <td style="color: #ccc;">${detalhe.antes || '--'}</td>
                            <td style="color: #ccc;">${detalhe.depois || '--'}</td>
                        </tr>
                    `;
                });
            } else {
                corpoTabela.innerHTML = `<tr><td colspan="3" class="vazio">Nenhum detalhe adicional disponível para esta ação.</td></tr>`;
            }

            // Exibe o modal adicionando a classe ativa
            document.getElementById('modal-auditoria').classList.add('ativo');
        }

        function fecharModalAuditoria() {
            document.getElementById('modal-auditoria').classList.remove('ativo');
        }

        carregarAuditoria();
    </script>
</body>
</html>
